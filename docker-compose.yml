# LogSentinel - full local stack (no cloud services).
#   docker compose up -d --build        start everything
#   docker compose ps                   check health
#   docker compose logs -f backend      follow one service's logs
#   docker compose down                 stop (data in ./mlflow_data and volumes is kept)
#
# Ports on your machine:
#   8443 web UI (HTTPS)   8080 -> redirects to 8443   8000 backend API (/docs)
#   5000 MLflow UI        5001 model server           9090 Prometheus
#   9091 Pushgateway      9093 Alertmanager           3000 Grafana
name: logsentinel

x-mlflow-client-env: &mlflow-client-env
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
  MLFLOW_HTTP_REQUEST_TIMEOUT: "10"

services:
  # ------------------------------------------------------------ ML services
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    image: logsentinel-mlflow:latest
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --host 0.0.0.0 --port 5000
      --allowed-hosts "*"
    volumes:
      - ./mlflow_data:/mlflow
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  model:
    image: logsentinel-mlflow:latest
    command: >
      mlflow models serve
      -m "models:/LogSentinel@champion"
      --env-manager local
      --host 0.0.0.0 --port 5001
    environment:
      <<: *mlflow-client-env
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/ping', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------- application
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: logsentinel-backend:latest
    env_file: .env
    environment:
      <<: *mlflow-client-env
      MODEL_URL: http://model:5001/invocations
      MODEL_PING_URL: http://model:5001/ping
      REPO_DIR: /repo
      RETRAIN_DIR: /data/retrain_requests
      FEEDBACK_FILE: /data/feedback/feedback.jsonl
      CORS_ORIGINS: https://localhost:8443,http://localhost:8080
    volumes:
      - ./:/repo:ro                                # pipeline status, reports, logs (read-only)
      - ./retrain_requests:/data/retrain_requests  # retraining queue
      - ./feedback:/data/feedback                  # user feedback
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: logsentinel-frontend:latest
    environment:
      API_BASE_URL: ""                 # "" = same origin; nginx forwards /api to BACKEND_URL
      API_KEY: ${API_KEY}
      BACKEND_URL: http://backend:8000
      GRAFANA_URL: /grafana
      GRAFANA_UPSTREAM: http://grafana:3000
      MLFLOW_URL: http://localhost:5000
      HTTPS_PORT: "8443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    ports:
      - "8080:80"
      - "8443:443"
    restart: unless-stopped

  # ----------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:latest
    ports:
      - "9091:9091"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-enterprise:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_ROOT_URL: https://localhost:8443/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/logsentinel.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    environment:
      DOCKER_API_VERSION: "1.44"   # Docker engine rejects older API versions
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
