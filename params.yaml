data:
  raw_log: data/raw/HDFS_v1/HDFS.log
  labels: data/raw/HDFS_v1/preprocessed/anomaly_label.csv
  sample_log: data/sample/HDFS_2k.log

validation:
  max_malformed_ratio: 0.001       # at most 0.1% of lines may fail the format regex
  max_no_block_ratio: 0.001        # at most 0.1% of lines may lack a block ID
  min_label_coverage: 0.99         # >= 99% of labelled blocks must appear in the logs
  anomaly_ratio_range: [0.01, 0.10]
  report: reports/validation.json

spark:
  master: local[8]            # 8 cores; benchmark overrides this with local[1], local[2], ...
  driver_memory: 6g           # local mode: driver = executor, so this is Spark's total memory
  shuffle_partitions: 32      # partitions used when grouping by block (default 200 is too many locally)

parse:
  output: data/processed/parsed
  report: reports/parse_stats.json

split:
  train: 0.7
  val: 0.1
  test: 0.2
  seed: 42
  output: data/processed/splits.csv
  report: reports/split_stats.json

templates:
  sim_th: 0.85              # high: events differing by one word (e.g. terminating vs Interrupted.) stay separate
  depth: 4                  # depth of the Drain prefix tree
  max_children: 100         # max children per tree node
  state_path: models/drain3/drain3_state.bin
  templates_csv: models/drain3/templates.csv
  report: reports/template_stats.json

match:
  search_strategy: fallback   # tree search first, then full search among same-length templates
  output: data/processed/matched
  report: reports/match_stats.json

sessionize:
  output: data/processed/sessions
  report: reports/session_stats.json

benchmark:
  cores: [1, 2, 4, 8, 12, 16]
  stages: [parse, match]
  report: reports/benchmark.json
  figure: reports/figures/03_throughput_vs_cores.png

featurize:
  min_block_freq: 1           # keep rare templates (EDA: rare events = failure signals)
  use_tfidf: false            # plain counts; set true to try TF-IDF weighting
  output_dir: data/processed/features
  vectorizer: models/features/vectorizer.json
  report: reports/featurize_stats.json

train:
  experiment: LogSentinel
  serve_model: lr             # which model the web app serves: lr or iforest
  seed: 42
  top_k_events: 6             # events shown in the explanation for each session
  lr:
    C: [0.01, 0.1, 1.0, 10.0]
    class_weight: balanced    # compensates the 3% anomaly rate; null = no weighting
    max_iter: 2000
  iforest:
    n_estimators: [100, 200]
    max_samples: [256, 1024]
    train_on_normal_only: true
  model_dir: models/model
  figures_dir: reports/figures/training
  report: reports/train_metrics.json

package:
  registered_name: LogSentinel
  min_improvement: 0.0        # new version becomes champion if test F1 >= champion F1 + this
  output: models/pyfunc
  report: reports/package.json
