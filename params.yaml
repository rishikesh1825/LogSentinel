data:
  raw_log: data/raw/HDFS_v1/HDFS.log
  labels: data/raw/HDFS_v1/preprocessed/anomaly_label.csv
  sample_log: data/sample/HDFS_2k.log

validation:
  max_malformed_ratio: 0.001       # at most 0.1% of lines may fail the format regex
  max_no_block_ratio: 0.001        # at most 0.1% of lines may lack a block ID
  min_label_coverage: 0.99         # >= 99% of labelled blocks must appear in the logs
  anomaly_ratio_range: [0.01, 0.10]
  report: reports/validation.json

spark:
  master: local[8]            # 8 cores; benchmark overrides this with local[1], local[2], ...
  driver_memory: 6g           # local mode: driver = executor, so this is Spark's total memory
  shuffle_partitions: 32      # partitions used when grouping by block (default 200 is too many locally)

parse:
  output: data/processed/parsed
  report: reports/parse_stats.json

split:
  train: 0.7
  val: 0.1
  test: 0.2
  seed: 42
  output: data/processed/splits.csv
  report: reports/split_stats.json

templates:
  sim_th: 0.85              # high: events differing by one word (e.g. terminating vs Interrupted.) stay separate
  depth: 4                  # depth of the Drain prefix tree
  max_children: 100         # max children per tree node
  state_path: models/drain3/drain3_state.bin
  templates_csv: models/drain3/templates.csv
  report: reports/template_stats.json
