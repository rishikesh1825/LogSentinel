route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    # Drift alerts trigger the retraining webhook on the backend.
    - matchers:
        - action="retrain"
      receiver: retrain-webhook

receivers:
  - name: default          # other alerts are shown in the Alertmanager UI (port 9093)
  - name: retrain-webhook
    webhook_configs:
      - url: http://backend:8000/api/v1/webhooks/alertmanager
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/webhook_token
