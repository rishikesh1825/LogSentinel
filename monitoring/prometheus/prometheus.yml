global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Application: request rate, latency, anomaly rate, unseen-template (drift) rate, errors
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # Data/ML pipeline: stage durations, success, throughput (pushed by src/utils/run_stage.py)
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # Every container (mlflow, model, backend, frontend, ...): CPU, memory, network
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Host machine: CPU, memory, disk
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Monitoring stack itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ["grafana:3000"]
