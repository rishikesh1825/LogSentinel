stages:
  validate:
    cmd: python -m src.ingest.validate
    deps:
      - src/ingest/validate.py
      - src/utils
      - data/raw/HDFS_v1
    params:
      - data
      - validation
    metrics:
      - reports/validation.json:
          cache: false
  parse:
    cmd: python -m src.parsing.parse
    deps:
      - src/parsing/parse.py
      - src/utils
      - data/raw/HDFS_v1/HDFS.log
      - reports/validation.json
    params:
      - data.raw_log
      - spark
      - parse
    outs:
      - data/processed/parsed
    metrics:
      - reports/parse_stats.json:
          cache: false
  split:
    cmd: python -m src.ingest.split
    deps:
      - src/ingest/split.py
      - src/utils
      - data/raw/HDFS_v1/preprocessed/anomaly_label.csv
      - reports/validation.json
    params:
      - data.labels
      - split
    outs:
      - data/processed/splits.csv
    metrics:
      - reports/split_stats.json:
          cache: false
  mine_templates:
    cmd: python -m src.parsing.mine_templates
    deps:
      - src/parsing/mine_templates.py
      - src/parsing/drain_config.py
      - src/utils
      - data/processed/parsed
      - data/processed/splits.csv
    params:
      - templates
      - spark
    outs:
      - models/drain3/drain3_state.bin
      - models/drain3/templates.csv
    metrics:
      - reports/template_stats.json:
          cache: false
  match:
    cmd: python -m src.parsing.match
    deps:
      - src/parsing/match.py
      - src/parsing/drain_config.py
      - src/utils
      - data/processed/parsed
      - data/processed/splits.csv
      - models/drain3/drain3_state.bin
    params:
      - templates
      - match
      - spark
    outs:
      - data/processed/matched
    metrics:
      - reports/match_stats.json:
          cache: false
