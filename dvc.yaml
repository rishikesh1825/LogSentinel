# LogSentinel pipeline (DVC DAG). Run everything with:  dvc repro
# Every stage runs through src.utils.run_stage, which records the run in
# logs/pipeline_runs.jsonl and pushes stage metrics to the Prometheus Pushgateway.
stages:
  validate:
    cmd: python -m src.utils.run_stage validate --report reports/validation.json -- python -m src.ingest.validate
    deps:
      - src/ingest/validate.py
      - src/utils
      - data/raw/HDFS_v1
    params:
      - data
      - validation
    metrics:
      - reports/validation.json:
          cache: false

  parse:
    cmd: python -m src.utils.run_stage parse --report reports/parse_stats.json -- python -m src.parsing.parse
    deps:
      - src/parsing/parse.py
      - src/utils
      - data/raw/HDFS_v1/HDFS.log
      - reports/validation.json
    params:
      - data.raw_log
      - spark
      - parse
    outs:
      - data/processed/parsed
    metrics:
      - reports/parse_stats.json:
          cache: false

  split:
    cmd: python -m src.utils.run_stage split --report reports/split_stats.json -- python -m src.ingest.split
    deps:
      - src/ingest/split.py
      - src/utils
      - data/raw/HDFS_v1/preprocessed/anomaly_label.csv
      - reports/validation.json
    params:
      - data.labels
      - split
    outs:
      - data/processed/splits.csv
    metrics:
      - reports/split_stats.json:
          cache: false

  mine_templates:
    cmd: python -m src.utils.run_stage mine_templates --report reports/template_stats.json -- python -m src.parsing.mine_templates
    deps:
      - src/parsing/mine_templates.py
      - src/parsing/drain_config.py
      - src/utils
      - data/processed/parsed
      - data/processed/splits.csv
    params:
      - templates
      - spark
    outs:
      - models/drain3/drain3_state.bin
      - models/drain3/templates.csv
    metrics:
      - reports/template_stats.json:
          cache: false

  match:
    cmd: python -m src.utils.run_stage match --report reports/match_stats.json -- python -m src.parsing.match
    deps:
      - src/parsing/match.py
      - src/parsing/drain_config.py
      - src/utils
      - data/processed/parsed
      - data/processed/splits.csv
      - models/drain3/drain3_state.bin
    params:
      - templates
      - match
      - spark
    outs:
      - data/processed/matched
    metrics:
      - reports/match_stats.json:
          cache: false

  sessionize:
    cmd: python -m src.utils.run_stage sessionize --report reports/session_stats.json -- python -m src.parsing.sessionize
    deps:
      - src/parsing/sessionize.py
      - src/parsing/match.py
      - src/utils
      - data/processed/matched
      - data/processed/splits.csv
    params:
      - sessionize
      - spark
    outs:
      - data/processed/sessions
    metrics:
      - reports/session_stats.json:
          cache: false

  featurize:
    cmd: python -m src.utils.run_stage featurize --report reports/featurize_stats.json -- python -m src.features.featurize
    deps:
      - src/features
      - src/utils
      - data/processed/sessions
    params:
      - featurize
      - sessionize.output
    outs:
      - data/processed/features
      - models/features/vectorizer.json
    metrics:
      - reports/featurize_stats.json:
          cache: false

  train:
    cmd: python -m src.utils.run_stage train --report reports/train_metrics.json -- python -m src.training.train
    deps:
      - src/training/train.py
      - src/features/vectorizer.py
      - src/utils
      - data/processed/features
      - models/features/vectorizer.json
      - models/drain3/templates.csv
    params:
      - train
      - featurize
      - templates
    outs:
      - models/model
      - reports/figures/training:
          cache: false
    metrics:
      - reports/train_metrics.json:
          cache: false

  package:
    cmd: python -m src.utils.run_stage package --report reports/package.json -- python -m src.training.package
    deps:
      - src/model
      - src/training/package.py
      - src/features/vectorizer.py
      - src/parsing/drain_config.py
      - src/utils
      - models/drain3/drain3_state.bin
      - models/drain3/templates.csv
      - models/features/vectorizer.json
      - models/model
      - requirements.txt
    params:
      - package
    outs:
      - models/pyfunc
    metrics:
      - reports/package.json:
          cache: false
