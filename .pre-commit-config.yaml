# Hooks run on `git commit` unless a hook says otherwise.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^dvc\.lock$   # machine-written by DVC; long cmds wrap with trailing spaces
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files   # stops you committing big data files to Git by mistake
        args: ["--maxkb=1000"]
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: isort
        language: system
        types: [python]
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      # Local CI: lint + unit tests + DVC status, before every `git push`.
      - id: local-ci
        name: local CI (scripts/ci.sh)
        entry: bash scripts/ci.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
